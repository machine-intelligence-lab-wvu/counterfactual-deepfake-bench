name: native_up_2s
version: 1
purpose: 'Full frame at 1280x704 for reals of any size: scale up or down to cover,
  fixed window at the median YuNet face centre (frame centre if no face). Fakes (1280x704)
  pass through. Ignores native''s never-upscale rule so every real clip of >= 2 s
  is usable.'
